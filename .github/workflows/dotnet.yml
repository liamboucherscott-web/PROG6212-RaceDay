name: .NET API Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore RaceDay.sln
      
    - name: Build API
      run: dotnet build RaceDay.sln --no-restore
      
    - name: Test
      run: dotnet test RaceDay.sln --no-build --verbosity normal